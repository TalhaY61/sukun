name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Sukun.sln -c Release
      - run: dotnet run --project tests/Sukun.Tests -c Release --no-build
      - name: Package portable preview
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: Sukun-win-x64
          path: |
            artifacts/Sukun-win-x64.exe
            artifacts/Sukun-win-x64.zip
            artifacts/SHA256SUMS.txt
